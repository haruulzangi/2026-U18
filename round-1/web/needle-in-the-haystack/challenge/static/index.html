<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Needle in the Haystack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }
    .card {
      background: #242424;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      color: #f0c040;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }
    p.subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }
    button {
      background: #f0c040;
      color: #1a1a1a;
      border: none;
      border-radius: 4px;
      padding: 10px 28px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #e0b030; }
    button:disabled { background: #555; color: #999; cursor: default; }
    #result {
      margin-top: 28px;
      padding: 16px;
      background: #1a1a1a;
      border-radius: 4px;
      border: 1px solid #3a3a3a;
      font-size: 0.85rem;
      word-break: break-all;
    }
    #result.success { border-color: #4caf50; color: #4caf50; }
    #result.error { border-color: #f44336; color: #f44336; }
    .label { color: #888; font-size: 0.75rem; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Needle in the Haystack</h1>
    <p class="subtitle">The flag is hidden somewhere. Can you find it?</p>
    <button id="btn">Search the haystack</button>
    <div id="result" hidden></div>
  </div>

  <script>
    function b64urlEncode(bytes) {
      return btoa(String.fromCharCode(...new Uint8Array(bytes)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    function b64urlDecode(str) {
      const padded = str.replace(/-/g, '+').replace(/_/g, '/')
        + '='.repeat((4 - str.length % 4) % 4);
      return Uint8Array.from(atob(padded), c => c.charCodeAt(0));
    }

    document.getElementById('btn').addEventListener('click', async () => {
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');
      btn.disabled = true;
      result.hidden = true;
      result.className = '';

      try {
        // 1. Generate X25519 keypair
        const keyPair = await crypto.subtle.generateKey(
          { name: 'X25519' },
          true,
          ['deriveBits']
        );

        // 2. Export client public key
        const pubKeyRaw = await crypto.subtle.exportKey('raw', keyPair.publicKey);
        const pubKeyB64 = b64urlEncode(pubKeyRaw);

        // 3. Fetch encrypted flag from server
        const resp = await fetch(`/flag?pub_key=${pubKeyB64}`);
        if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
        const data = await resp.json();

        // 4. Import server public key
        const serverPubBytes = b64urlDecode(data.server_pub_key);
        const serverPubKey = await crypto.subtle.importKey(
          'raw',
          serverPubBytes,
          { name: 'X25519' },
          false,
          []
        );

        // 5. Derive shared secret (256 bits)
        const sharedBits = await crypto.subtle.deriveBits(
          { name: 'X25519', public: serverPubKey },
          keyPair.privateKey,
          256
        );

        // 6. HKDF-SHA256 -> AES-256-GCM key
        const hkdfKey = await crypto.subtle.importKey(
          'raw', sharedBits, { name: 'HKDF' }, false, ['deriveKey']
        );
        const aesKey = await crypto.subtle.deriveKey(
          {
            name: 'HKDF',
            hash: 'SHA-256',
            salt: new Uint8Array(0),
            info: new TextEncoder().encode('needle-in-the-haystack'),
          },
          hkdfKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        // 7. Decrypt flag
        const nonce = b64urlDecode(data.nonce);
        const ciphertext = b64urlDecode(data.ciphertext);
        const plaintext = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: nonce },
          aesKey,
          ciphertext
        );
        // 8. Flag successfully decrypted — discard it
        result.className = 'success';
        result.textContent = 'Flag successfully decrypted.';
        result.hidden = false;
      } catch (err) {
        result.className = 'error';
        result.textContent = `Error: ${err.message}`;
        result.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
