description: |
  The Bureau of Lost Correspondence has restored its antient and bleak apparatus.
  Three dispatches may be solicited from the wire:
  - `GET /public-key` obtains the bureau's publick key
  - `GET /get-flag` retrieves the sealed dispatch as base64 ciphertext
  - `POST /check-flag` presents a ciphertext for judgement
  The bureau's cipherwork is RSA with PKCS#1 v1.5 padding.
  Proceed with the decorum befitting a message older than the wires that carry it. The type is wood; the cipher is cold.
