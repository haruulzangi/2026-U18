<!DOCTYPE html>
<html>
<head>
    <title>Enterprise Portal - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 Enterprise Employee Portal</h1>
            <p>Secure Access Control System v3.2</p>
        </div>
        
        <div class="login-box">
            <h2>🔐 Sign In</h2>
            <input type="text" id="username" placeholder="Username" autocomplete="off">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login →</button>
            
            <div class="info-box" style="margin-top: 20px;">
                <p><strong>📢 Access Notice:</strong></p>
                <p>New employees must register to access the portal.</p>
                <p style="margin-top: 10px; font-size: 12px; color: #666;">
                    ⚠️ For training purposes only. Do not use real passwords.
                </p>
            </div>
            
            <div style="margin-top: 20px; text-align: center;">
                <button onclick="showRegister()" style="background: #6c757d; font-size: 14px;">
                    📝 New Employee? Register Here
                </button>
            </div>
        </div>
        
        <!-- Registration Form (hidden by default) -->
        <div class="login-box" id="registerBox" style="display: none; margin-top: 20px;">
            <h2>📝 Employee Registration</h2>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">
                New employees must register to access the portal.
            </p>
            <input type="text" id="regUsername" placeholder="Username (required)" autocomplete="off">
            <input type="password" id="regPassword" placeholder="Password (min 6 characters)">
            <input type="text" id="regEmail" placeholder="Email (optional)">
            <input type="text" id="regDepartment" placeholder="Department">
            <button onclick="register()" style="background: #28a745;">Register →</button>
            <button onclick="showLogin()" style="background: #6c757d; margin-left: 10px;">← Back to Login</button>
        </div>
    </div>
    
    <script>
        function showRegister() {
            document.querySelector('.login-box').style.display = 'none';
            document.getElementById('registerBox').style.display = 'block';
        }
        
        function showLogin() {
            document.querySelector('.login-box').style.display = 'block';
            document.getElementById('registerBox').style.display = 'none';
        }
        
        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const email = document.getElementById('regEmail').value.trim();
            const department = document.getElementById('regDepartment').value.trim();
            
            if (!username || !password) {
                alert('Username and password are required');
                return;
            }
            
            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email, department })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    alert(data.message);
                    showLogin();
                    document.getElementById('username').value = username;
                    document.getElementById('password').value = '';
                } else {
                    alert('Registration failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            }
        }
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                alert('Please enter username and password');
                return;
            }
            
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert('Login failed: Invalid credentials');
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            }
        }
        
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
        
        document.getElementById('regPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                register();
            }
        });
        
        console.log('%c🚨 SECURITY WARNING: This is a production system', 'color: red; font-size: 14px;');
        console.log('%cUnauthorized access attempts are logged and monitored.', 'color: orange;');
    </script>
</body>
</html>
