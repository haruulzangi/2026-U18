{% extends "base.html" %}
{% block body %}
  <h1>Login</h1>
  <form method="post" class="card">
    <label>Username
      <input name="username" autocomplete="username" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn">Sign in</button>
  </form>
{% endblock %}
