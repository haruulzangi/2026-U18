description: |
  My grandfather left me a single phone and one rule: "Never lose this app. The
  vault inside knows who you are, and it will only open for you."

  I pressed the button. Nothing happened. No flag, no error, just a quiet little
  app pretending to be empty. But I know there's something in there. I can feel
  it whispering through the wires every time I tap that button.

  Help me crack open my inheritance.
