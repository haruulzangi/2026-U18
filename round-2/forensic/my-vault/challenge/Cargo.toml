[package]
name = "my-vault-server"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "=0.10.3"
axum = "=0.8.9"
base64 = "=0.22.1"
der-parser = "=10.0.0"
rand = "=0.8.6"
rsa = "=0.9.10"
rustls-pki-types = "=1.14.1"
rustls-webpki = { version = "=0.103.13", features = ["ring"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "1.52.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
x509-parser = "=0.18.1"

[dev-dependencies]
rcgen = { version = "=0.14.7", features = ["x509-parser"] }
tower = { version = "=0.5.3", features = ["util"] }
yasna = "=0.5.2"
