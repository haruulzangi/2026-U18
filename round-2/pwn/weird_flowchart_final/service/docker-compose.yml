services:
  server:
    image: ghcr.io/haruulzangi/2026-u18-private/weird_flowchart_final-server:latest
    environment:
      - NODE_ENV=production
      - PORT=5174
    expose:
      - "5174"
    restart: unless-stopped
    networks:
      - internal

  client:
    image: ghcr.io/haruulzangi/2026-u18-private/weird_flowchart_final-client:latest
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - traefik_proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.weird-flowchart-http.entrypoints=web
      - traefik.http.routers.weird-flowchart-http.rule=Host(`weird-flowchart.u18-2026.haruulzangi.mn`)
      - traefik.http.routers.weird-flowchart-http.middlewares=weird-flowchart-https
      - traefik.http.middlewares.weird-flowchart-https.redirectscheme.scheme=https
      - traefik.http.routers.weird-flowchart.entrypoints=websecure
      - traefik.http.routers.weird-flowchart.rule=Host(`weird-flowchart.u18-2026.haruulzangi.mn`)
      - traefik.http.services.weird-flowchart.loadbalancer.server.port=80
      - traefik.http.routers.weird-flowchart.tls=true
      - traefik.http.routers.weird-flowchart.tls.certresolver=myresolver

networks:
  internal:
    internal: true
  traefik_proxy:
    external: true