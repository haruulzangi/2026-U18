services:
  qword:
    build: .
    image: ghcr.io/haruulzangi/2026-u18-private/qword:latest
    container_name: qword
    networks:
      - traefik_proxy
    restart: unless-stopped

    environment:
      FLAG: ${FLAG:-HZU18{Is_qw0rd_t00_Much?}}

    # Hardening
    read_only: true
    tmpfs:
      # `exec` lets run.py drop the patched copy of the binary into /tmp
      # and execve it; `nosuid,nodev` keep that surface tight. /tmp is
      # also where /flag lives (symlinked from the read-only rootfs).
      - /tmp:exec,size=64m,mode=1777,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy

      # TCP-over-TLS via SNI — players connect with
      #   ncat --ssl qword.u18-2026.haruulzangi.mn 1337
      - traefik.tcp.routers.qword.entrypoints=tcp1337
      - traefik.tcp.routers.qword.rule=HostSNI(`qword.u18-2026.haruulzangi.mn`)
      - traefik.tcp.routers.qword.tls=true
      - traefik.tcp.routers.qword.tls.certresolver=myresolver
      - traefik.tcp.services.qword.loadbalancer.server.port=1337

networks:
  traefik_proxy:
    external: true
